[Launch]
ProgramExecutable=scrcpy-launcher\scrcpy-launcher.exe
CommandLineArguments='--config "%PAL:DataDir%\config.json"'
WorkingDirectory=%PAL:AppDir%\scrcpy-launcher
CleanTemp=true
SinglePortableAppInstance=true
SingleAppInstance=true
WaitForProgram=true
WaitForOtherInstances=true
DirectoryMoveOK=yes
SupportsUNC=warn

[Environment]
SCRCPY_LAUNCHER_PORTABLEAPPS_DATA_DIR=%PAL:DataDir%

name: Dependency security audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 15 * * 1"
  push:
    paths:
      - "requirements*.txt"
      - "packaging/dependencies/**"
      - "packaging/security_audit.py"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - "packaging/dependencies/**"
      - "packaging/security_audit.py"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Validate locked and native dependency policy
        run: python packaging/security_audit.py
      - name: Audit locked Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-build.txt
          no-deps: true
          require-hashes: true

name: Build validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install locked build dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build and verify portable distribution
        shell: pwsh
        run: .\packaging\build.ps1 -SkipInstaller -SkipPortableApps

      - name: Upload validated build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: scrcpy-launcher-build-${{ github.sha }}
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 14

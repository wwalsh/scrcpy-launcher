name: Build validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install locked build dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build and verify portable distribution
        shell: pwsh
        run: .\packaging\build.ps1 -SkipInstaller -SkipPortableApps

      - name: Upload validated build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scrcpy-launcher-build-${{ github.sha }}
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 14

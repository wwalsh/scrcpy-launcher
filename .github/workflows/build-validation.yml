name: Build validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install locked build dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build and verify portable distribution
        shell: pwsh
        run: .\packaging\build.ps1 -SkipInstaller -SkipPortableApps

      - name: Upload validated build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrcpy-launcher-build-${{ github.sha }}
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 14
